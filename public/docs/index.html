<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TelcoVantage ERP documentation</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      :root {
        --theme-color: #b8892f;
      }

      body {
        color: #1f2933;
      }

      .markdown-section {
        max-width: 980px;
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        color: #172033;
      }

      .markdown-section table {
        display: table;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading documentation...</div>
    <script>
      window.$docsify = {
        name: "TelcoVantage ERP",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        search: {
          placeholder: "Search",
          noData: "No results",
          depth: 3,
        },
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  </body>
</html>
